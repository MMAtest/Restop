name: Restop legacy API security gates

on:
  push:
    branches:
      - feat/restop-security-review-20261016
    paths:
      - backend/server.py
      - backend/test_legacy_security.py
      - .github/workflows/restop-legacy-security.yml
  pull_request:
    paths:
      - backend/server.py
      - backend/test_legacy_security.py
      - .github/workflows/restop-legacy-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-guards:
    name: Legacy route guards (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify backend syntax
        run: python -m py_compile backend/server.py
      - name: Verify route protection and role matrix
        run: python -m unittest discover -s backend -p 'test_legacy_security.py' -v
      - name: Verify existing auth and invoice regressions
        run: |
          cd backend
          python -m unittest test_auth_guard test_invoice_guard test_invoice_reservation test_invoice_transaction test_ocr_route_security -q
