<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restop · Aperçu responsive</title><style>body{margin:0;background:#e9eae5;padding:20px;font:14px Inter,Arial,sans-serif}header{max-width:1000px;margin:0 auto 16px}h1{font-size:24px}nav{display:flex;flex-wrap:wrap;gap:8px}button{min-height:44px;padding:10px 16px;border:1px solid #1d4241;border-radius:8px;background:white;color:#1d4241;cursor:pointer}button[aria-pressed=true]{background:#1d4241;color:white}iframe{display:block;margin:auto;border:1px solid #cad4c5;width:390px;max-width:100%;height:844px;background:white;box-sizing:border-box}p{color:#3a5349}</style></head><body><header><h1>Restop · Contrôle des écrans</h1><p>Application réelle. Utilisez la démo commerciale pour explorer les fonctionnalités sans données personnelles.</p><nav aria-label="Largeur de l’aperçu"><button data-width="320">Petit mobile</button><button data-width="375">Mobile</button><button data-width="390" aria-pressed="true">Grand mobile</button><button data-width="768">Tablette</button><button data-width="100%">Ordinateur</button></nav></header><iframe id="preview" title="Application Restop" src="/app"></iframe><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#preview').style.width=button.dataset.width==='100%'?'100%':button.dataset.width+'px';document.querySelectorAll('button').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));}));</script></body></html>
